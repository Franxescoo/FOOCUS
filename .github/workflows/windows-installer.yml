          body: |
            Instalador de Windows generado automáticamente desde el commit ${{ github.sha }}.

            Descarga FocusFlow-Setup.exe para instalar FocusFlow o actualizar una instalación existente.
          files: dist-installer/FocusFlow-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
) {
                throw "Latest semantic version tag is invalid: $latestTag"
              }
              $parts[2] = ([int]$parts[2] + 1).ToString()
              $version = "$($parts[0]).$($parts[1]).$($parts[2])"
            }
            "release_version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
            $appVersion = "V$version"
